[project]
name = "innernavi-django"
version = "0.1.0"
description = "InnerNavi Django development foundation; product features are not implemented."
requires-python = ">=3.13.16,<3.14"
dependencies = [
    "django==5.2.17",
    "djangorestframework==3.18.1",
    "celery[redis]==5.6.3",
    "psycopg[binary]==3.3.6",
    "innernavi-map-processing",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
]

[tool.uv]
package = false
required-version = "==0.12.5"
cache-dir = ".cache/uv"
python-downloads = "never"

[tool.uv.workspace]
members = ["packages/map_processing"]

[tool.uv.sources]
innernavi-map-processing = { workspace = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
pythonpath = ["apps/backend"]
testpaths = ["apps/backend/tests", "packages/map_processing/tests"]
addopts = "--strict-markers"
cache_dir = ".cache/pytest"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["packages/map_processing/src"]
